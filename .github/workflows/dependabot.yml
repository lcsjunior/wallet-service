name: Dependabot

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify Build
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests and checks
        run: ./mvnw --batch-mode --show-version clean verify
