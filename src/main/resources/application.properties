spring.application.name=wallet-service

springdoc.swagger-ui.enabled=false

spring.datasource.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.cache.type=${CACHE_TYPE:redis}
spring.cache.redis.time-to-live=2h
spring.cache.redis.key-prefix=${spring.application.name}:

management.health.redis.enabled=false

logging.structured.format.console=ecs
logging.level.root=INFO
logging.level.com.example.wallet=INFO

wallet.http-log.level=INFO
wallet.http-log.max-body-length=4096
wallet.http-log.replacement=***
wallet.http-log.masked-headers=authorization,cookie,set-cookie,proxy-authorization
wallet.http-log.masked-body-fields=password,token,secret
wallet.http-log.excluded-paths=/actuator/**,/h2-console/**,/swagger-ui/**,/v3/api-docs/**
